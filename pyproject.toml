[project]
name = "innomindgames"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiogram3-calendar>=0.1.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
